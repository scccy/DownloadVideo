server:
  port: 9100
  address: 0.0.0.0

spring:
  application:
    name: douyin-service
  config:
    import: "optional:nacos:douyin-service-config.yaml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_HOST:localhost}:8848
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        refresh:
          enabled: true
  main:
    web-application-type: reactive
    allow-circular-references: true
    allow-bean-definition-overriding: true
  devtools:
    restart:
      enabled: true  # 启用热部署
      additional-exclude: static/**  # 排除静态资源
    livereload:
      enabled: true  # 启用 LiveReload
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/video_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: asdsc88Q12
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
    hikari:
      enabled: false
  webflux:
    base-path: /api  # 设置应用的根路径为 /api

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.scccy.downloadvideo.platform.douyin.model.*
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    log-level: debug
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  config: classpath:log4j2-spring.xml
  log4j2:
    contextSelector: org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
  level:
    root: INFO
    com.scccy.downloadvideo: DEBUG
    org.springframework.web: INFO
    org.springframework.webflux: DEBUG
    org.springframework.data: DEBUG
    org.springdoc: DEBUG

feign:
  okhttp:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: debug

nodejs:
  path: /Volumes/opt/lan/nodejs/node-v22.13.0/bin/node

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表
  openapi:
    title: 视频下载平台接口文档
    description: 视频下载平台 API 文档
    email: contact@example.com
    concat: Admin
    url: https://doc.xiaominfo.com
    version: v4.0
    license: Apache 2.0
    license-url: https://stackoverflow.com/
    terms-of-service-url: https://stackoverflow.com/