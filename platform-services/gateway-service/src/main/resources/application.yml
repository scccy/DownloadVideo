server:
  port: 9000

spring:
  application:
    name: gateway
  config:
    import: "optional:nacos:gateway-config.yaml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
      config:
        server-addr: localhost:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
        refresh:
          enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: douyin-service
          uri: lb://douyin-service
          predicates:
            - Path=/api/douyin/**
          filters:
            - StripPrefix=2
        - id: douyin-service-swagger
          uri: lb://douyin-service
          predicates:
            - Path=/swagger-ui.html
            - Path=/v3/api-docs/**
          filters:
            - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/v3/api-docs
  main:
    web-application-type: reactive
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/video_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
      username: root
      password: asdsc88Q12
      type: com.alibaba.druid.pool.DruidDataSource
      druid:
        # 连接池配置
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,wall
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      hikari:
        enabled: false
# 日志配置
logging:
  config: classpath:log4j2-spring.xml
  level:
    com.scccy.downloadvideo: debug
    org.springframework.cloud.gateway: info
    reactor.netty.http.client: info

# 监控端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
