f2:
  download:
    path: Download
    folderize: true
    naming: "{create}_{desc}"
    timeout: 10
    max-retries: 5
    max-connections: 5
    max-counts: 0
    max-tasks: 10
    page-counts: 20
    proxy-host:
    proxy-port: 

download:
  client:
    url: # 可以为空，因为我们会在请求时传入完整URL

feign:
  client:
    config:
      download-client:
        connectTimeout: 5000
        readTimeout: 300000  # 下载需要更长的超时时间
        loggerLevel: basic 